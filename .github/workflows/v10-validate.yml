name: Validate V10 WebGPU Branch

on:
  push:
    branches: [v10-webgpu-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate V10 runtime and production bundle
        run: npm run check
      - name: Install Chromium for WebGPU regression
        run: npx playwright install --with-deps chromium
      - name: Test V10 WebGPU movement recoil IK and real assets
        run: npm run test:browser
