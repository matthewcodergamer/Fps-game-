name: Validate V10 WebGPU

on:
  push:
    branches: [v10-webgpu-real-assets]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-webgpu-validation
  cancel-in-progress: true

jobs:
  build-and-webgpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate strict V10 assets and production build
        run: npm run check

      - name: Install Chromium and Linux graphics dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xauth libvulkan1 mesa-vulkan-drivers

      - name: Real WebGPU gameplay regression suite
        env:
          CI: true
        run: xvfb-run -a -s '-screen 0 1440x900x24' npm run test:browser
