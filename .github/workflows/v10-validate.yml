name: Validate V10 WebGPU Branch

on:
  push:
    branches: [v10-webgpu-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire authoritative analog movement into V10 runtime
        run: |
          node tools/patch-v10-movement.mjs
          if ! git diff --quiet -- src/main-v10.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main-v10.js
            git commit -m "Fix V10 authoritative mobile movement"
            git push origin HEAD:v10-webgpu-rebuild
          fi
      - run: npm ci
      - name: Validate V10 runtime and production bundle
        run: npm run check
      - name: Use current Playwright WebGPU browser for regression
        run: npm install --no-save @playwright/test@1.62.1
      - name: Install current Chromium for WebGPU regression
        run: npx playwright install --with-deps chromium
      - name: Test V10 WebGPU movement recoil IK and real assets
        run: npm run test:browser
