name: Convert Blender asset packages to GLB

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets-source/imports/**/asset.json'
      - 'assets-source/blend/**.blend'
      - 'tools/blender/export_glb.py'

permissions:
  contents: write

concurrency:
  group: project-strike-blender-conversion
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh latest package state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Convert completed Blender packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          convert_one() {
            src="$1"
            package_root="$2"
            fallback_name="$3"
            category="models/props"
            asset_name="$fallback_name"

            if [ -f "$package_root/asset.json" ]; then
              category=$(python3 - "$package_root/asset.json" <<'PY'
import json,sys
try:
    data=json.load(open(sys.argv[1],encoding='utf-8'))
    print(data.get('category') or 'models/props')
except Exception:
    print('models/props')
PY
)
              asset_name=$(python3 - "$package_root/asset.json" <<'PY'
import json,sys,re
try:
    data=json.load(open(sys.argv[1],encoding='utf-8'))
    name=data.get('runtimeName') or data.get('name') or 'asset'
except Exception:
    name='asset'
print(re.sub(r'[^A-Za-z0-9._-]+','_',name).strip('_') or 'asset')
PY
)
            fi

            out="public/game-assets/${category}/${asset_name}.glb"
            report="public/game-assets/manifests/conversion-reports/${asset_name}.json"
            mkdir -p "$(dirname "$out")" "$(dirname "$report")"
            echo "Converting $src -> $out"
            blender -b "$src" -P tools/blender/export_glb.py -- "$src" "$out" "$report"

            test -s "$out"
            python3 - "$out" "$report" <<'PY'
import json, os, sys
out, report = sys.argv[1:]
with open(out,'rb') as f:
    assert f.read(4) == b'glTF', 'invalid GLB header'
data=json.load(open(report,encoding='utf-8'))
assert data['assertions']['hasMeshes']
assert data['assertions']['validGlbHeader']
assert data['outputBytes'] == os.path.getsize(out)
print('Validated:', out, data['meshCount'], 'meshes,', data['materialCount'], 'materials,', data['packageImagesFound'], 'package images')
PY
          }

          while IFS= read -r -d '' manifest; do
            package_root="$(dirname "$manifest")"
            mapfile -d '' blends < <(find "$package_root/raw" -type f -name '*.blend' -print0 2>/dev/null || true)
            if [ "${#blends[@]}" -eq 0 ]; then
              echo "No .blend found in $package_root/raw; skipping package"
              continue
            fi
            for src in "${blends[@]}"; do
              fallback="$(basename "${src%.blend}")"
              convert_one "$src" "$package_root" "$fallback"
            done
          done < <(find assets-source/imports -type f -name 'asset.json' -print0 2>/dev/null || true)

          while IFS= read -r -d '' src; do
            rel="${src#assets-source/blend/}"
            out="public/game-assets/imported/blend/${rel%.blend}.glb"
            report="public/game-assets/manifests/conversion-reports/legacy_$(basename "${src%.blend}").json"
            mkdir -p "$(dirname "$out")" "$(dirname "$report")"
            blender -b "$src" -P tools/blender/export_glb.py -- "$src" "$out" "$report"
          done < <(find assets-source/blend -type f -name '*.blend' -print0 2>/dev/null || true)

      - name: Commit converted runtime assets
        run: |
          git config user.name 'project-strike-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/game-assets
          if git diff --cached --quiet; then
            echo 'No converted asset changes.'
            exit 0
          fi
          git commit -m 'Convert completed Blender packages to validated GLB'
          git pull --rebase origin main
          git push origin main
