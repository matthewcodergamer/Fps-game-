name: Convert Project Strike source packages to GLB

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets-source/imports/**/asset.json'
      - 'assets-source/blend/**.blend'
      - 'tools/blender/export_glb.py'

permissions:
  contents: write

concurrency:
  group: project-strike-model-conversion
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh latest package state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Convert completed source packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob

          convert_one() {
            src="$1"
            package_root="$2"
            fallback_name="$3"
            category="models/props"
            asset_name="$fallback_name"

            if [ -f "$package_root/asset.json" ]; then
              category=$(python3 - "$package_root/asset.json" <<'PY'
import json,sys
try:
    data=json.load(open(sys.argv[1],encoding='utf-8'))
    print(data.get('category') or 'models/props')
except Exception:
    print('models/props')
PY
)
              asset_name=$(python3 - "$package_root/asset.json" <<'PY'
import json,sys,re
try:
    data=json.load(open(sys.argv[1],encoding='utf-8'))
    name=data.get('runtimeName') or data.get('name') or 'asset'
except Exception:
    name='asset'
print(re.sub(r'[^A-Za-z0-9._-]+','_',name).strip('_') or 'asset')
PY
)
            fi

            out="public/game-assets/${category}/${asset_name}.glb"
            report="public/game-assets/manifests/conversion-reports/${asset_name}.json"
            mkdir -p "$(dirname "$out")" "$(dirname "$report")"
            echo "Converting $src -> $out"
            blender -b -P tools/blender/export_glb.py -- "$src" "$out" "$report"

            test -s "$out"
            python3 - "$out" "$report" <<'PY'
import json, os, sys
out, report = sys.argv[1:]
with open(out,'rb') as f:
    assert f.read(4) == b'glTF', 'invalid GLB header'
data=json.load(open(report,encoding='utf-8'))
assert data['assertions']['hasMeshes']
assert data['assertions']['validGlbHeader']
assert data['outputBytes'] == os.path.getsize(out)
if os.path.getsize(out) >= 100 * 1024 * 1024:
    raise SystemExit(f'Runtime GLB is still too large for GitHub ({os.path.getsize(out)} bytes). Reduce source texture/geometry size.')
print('Validated:', out, data['meshCount'], 'meshes,', data['materialCount'], 'materials,', data['packageImagesFound'], 'package images')
PY
          }

          while IFS= read -r -d '' manifest; do
            package_root="$(dirname "$manifest")"
            raw="$package_root/raw"
            mkdir -p "$raw"

            chunked=$(python3 - "$manifest" <<'PY'
import json,sys
try: print('1' if json.load(open(sys.argv[1],encoding='utf-8')).get('chunked') else '0')
except Exception: print('0')
PY
)

            if [ "$chunked" = "1" ]; then
              source_name=$(python3 - "$manifest" <<'PY'
import json,sys,os
try: print(json.load(open(sys.argv[1],encoding='utf-8')).get('sourceName') or 'source.glb')
except Exception: print('source.glb')
PY
)
              assembled="$raw/$source_name"
              python3 - "$package_root/chunks" "$assembled" <<'PY'
from pathlib import Path
import sys
chunks=Path(sys.argv[1]); out=Path(sys.argv[2]); out.parent.mkdir(parents=True,exist_ok=True)
parts=sorted(chunks.glob('part-*.bin'))
if not parts: raise SystemExit('Chunked package has no part files')
with out.open('wb') as w:
    for p in parts:
        with p.open('rb') as r:
            while True:
                b=r.read(1024*1024)
                if not b: break
                w.write(b)
print('Reassembled', len(parts), 'chunks ->', out, out.stat().st_size, 'bytes')
PY
            fi

            mapfile -d '' sources < <(find "$raw" -type f \( -iname '*.blend' -o -iname '*.fbx' -o -iname '*.gltf' -o -iname '*.glb' \) -print0 2>/dev/null || true)
            if [ "${#sources[@]}" -eq 0 ]; then
              echo "No convertible source found in $raw; skipping package"
              continue
            fi

            src="${sources[0]}"
            fallback="$(basename "$src")"
            fallback="${fallback%.*}"
            convert_one "$src" "$package_root" "$fallback"
          done < <(find assets-source/imports -type f -name 'asset.json' -print0 2>/dev/null || true)

          while IFS= read -r -d '' src; do
            rel="${src#assets-source/blend/}"
            out="public/game-assets/imported/blend/${rel%.blend}.glb"
            report="public/game-assets/manifests/conversion-reports/legacy_$(basename "${src%.blend}").json"
            mkdir -p "$(dirname "$out")" "$(dirname "$report")"
            blender -b -P tools/blender/export_glb.py -- "$src" "$out" "$report"
          done < <(find assets-source/blend -type f -name '*.blend' -print0 2>/dev/null || true)

      - name: Commit converted runtime assets
        run: |
          git config user.name 'project-strike-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/game-assets
          if git diff --cached --quiet; then
            echo 'No converted asset changes.'
            exit 0
          fi
          git commit -m 'Convert queued Project Strike source packages to validated GLB'
          git pull --rebase origin main
          git push origin main
