name: Deploy Project Strike Reboot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reboot dependencies
        run: npm install --no-audit --no-fund
      - name: Verify architecture and build
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Let the branch-based Pages build finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # While Settings > Pages > Source is "Deploy from a branch", GitHub also publishes the raw, unbundled source
          # on every push, and that copy cannot run in a browser (bare @babylonjs imports). Wait until that legacy build
          # of this commit is done so the bundled game deployed below is always the one that goes live.
          for i in $(seq 1 36); do
            build=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || true)
            status=$(echo "$build" | jq -r '.status // empty' 2>/dev/null)
            commit=$(echo "$build" | jq -r '.commit // empty' 2>/dev/null)
            echo "legacy Pages build: ${status:-none} ${commit}"
            [ -z "$status" ] && break
            if [ "$commit" = "$GITHUB_SHA" ] && { [ "$status" = "built" ] || [ "$status" = "errored" ]; }; then break; fi
            sleep 5
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-diagnostics:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reboot dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install software WebGPU runtime
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
      - name: Verify Babylon WebGPU + Havok boot
        run: xvfb-run -a -s '-screen 0 1280x720x24' npm run test:browser
