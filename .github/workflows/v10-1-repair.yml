name: Validate V10.1 World Body Audio Fix

on:
  push:
    branches: [v10.1-world-body-audio-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate V10.1 production bundle
        run: npm run check
      - name: Use current Playwright WebGPU browser
        run: npm install --no-save @playwright/test@1.62.1
      - name: Install current Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V10.1 world body switching audio regression
        run: npx playwright test tests/v10-1.spec.js
